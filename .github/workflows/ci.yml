name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # Informational only — the repo carries a pre-existing clippy
      # warning baseline, so this never blocks a merge.
      - name: Clippy (informational)
        run: cargo clippy --all-targets || true

  # Real servers in Docker. Ubuntu runners ship a working daemon; macOS
  # runners do not, so this job is Linux-only. It is separate from `test` so
  # a Docker Hub hiccup cannot block the fast, hermetic suite.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Integration tests (Docker)
        run: cargo test -- --ignored --test-threads=2
