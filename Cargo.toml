[package]
name = "dbx"
version = "0.1.0"
edition = "2024"
description = "Terminal database explorer — DataGrip-like UX, opencode-like UI"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/dbx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
flowmaid = "0.25"
unicode-width = "0.2"
