[package]
name = "dbx"
version = "0.4.2"
edition = "2024"
description = "Terminal database explorer — DataGrip-like UX, opencode-like UI"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/dbx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
bitflags = "2.8"
flowmaid = "0.25"
unicode-width = "0.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "bigdecimal", "uuid"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
dirs = "6.0.0"
arboard = "3.6.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
