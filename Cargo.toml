[package]
name = "dbx"
version = "0.5.2"
edition = "2024"
description = "Terminal database explorer — DataGrip-like UX, opencode-like UI"
license = "GPL-3.0-or-later"
repository = "https://github.com/go-routine-id/dbx"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "process", "net"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
bitflags = "2.8"
flowmaid = "0.25"
unicode-width = "0.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "bigdecimal", "uuid", "tls-rustls-ring"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
dirs = "6.0.0"
arboard = "3.6.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
# ClickHouse speaks HTTP(S) through ureq; a hand-built rustls config is what
# makes ssl_mode "require" (encrypt, skip verification) differ from "verify",
# and what carries ssl_ca / ssl_cert / ssl_key. Same feature set as ureq's own
# rustls dependency, so the crate is shared rather than duplicated.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
# The OS trust store, so `ssl_mode = "verify"` means the same thing on the
# ClickHouse driver as it does on Redis; webpki-roots is the fallback.
rustls-native-certs = "0.7"
webpki-roots = "0.26"
rust_xlsxwriter = "0.99.0"
tokio-util = { version = "0.7.19", features = ["compat"] }
tiberius = { version = "0.12.3", features = ["chrono"] }
# mongo — default features: rustls TLS (no OpenSSL system dep), DNS resolver, bson 2.x re-exported as mongodb::bson
mongodb = "3.9"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-insecure"] }
